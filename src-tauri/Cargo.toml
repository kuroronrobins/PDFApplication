[package]
name = "pdf-workbench"
version = "0.2.0"
description = "PDF Workbench"
authors = ["PDF Workbench"]
edition = "2021"

[lib]
name = "pdf_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
