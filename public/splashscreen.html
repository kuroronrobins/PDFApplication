<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Workbench</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Yu Gothic UI",
          "Yu Gothic",
          "BIZ UDPGothic",
          "Segoe UI",
          system-ui,
          sans-serif;
        background: transparent;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
        user-select: none;
      }

      .splash {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto auto;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(248, 250, 252, 0.98)),
          #f8fafc;
        box-shadow:
          0 22px 70px rgba(15, 23, 42, 0.24),
          0 2px 10px rgba(15, 23, 42, 0.08);
      }

      .picture {
        min-height: 0;
        padding: 18px 18px 8px;
      }

      .picture img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border: 1px solid rgba(191, 219, 254, 0.78);
        border-radius: 18px;
        background: #eef6ff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .license {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 22px 6px;
        color: #475569;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .license strong {
        color: #0f172a;
        font-size: 15px;
      }

      .status {
        display: grid;
        grid-template-columns: 18px 1fr;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 0 22px 16px;
        color: #64748b;
        font-size: 11px;
        font-weight: 700;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(37, 99, 235, 0.16);
        border-top-color: #2563eb;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }

      .status-line {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="PDF Workbench is starting">
      <section class="picture" aria-hidden="true">
        <img src="assets/splash-workbench-a.png" alt="" />
      </section>
      <section class="license">
        <strong>PDF Workbench</strong>
        <span>Licensed to koki kurokawa</span>
        <span>v0.1.0</span>
      </section>
      <section class="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-line" class="status-line">Preparing workspace</span>
      </section>
    </main>
    <script>
      const messages = [
        "Preparing workspace",
        "Checking session cache",
        "Connecting processing engine",
        "Loading workbench UI",
      ];
      const statusLine = document.getElementById("status-line");
      let index = 0;

      window.setInterval(() => {
        index = (index + 1) % messages.length;
        statusLine.textContent = messages[index];
      }, 1150);
    </script>
  </body>
</html>
